<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- indigo-500 -->
      <stop offset="100%" stop-color="#4338ca" /> <!-- indigo-700 -->
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Sleek rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- PM Letters in a crisp modern font style -->
  <g fill="#ffffff" transform="translate(90, 136)" filter="url(#shadow)">
    <!-- Letter P -->
    <path d="M 0 0 H 72 C 116.18 0 152 35.82 152 80 C 152 124.18 116.18 160 72 160 H 44 V 240 H 0 V 0 Z M 44 44 V 116 H 72 C 91.88 116 108 99.88 108 80 C 108 60.12 91.88 44 72 44 H 44 Z" />
    <!-- Letter M -->
    <path d="M 180 0 H 224 L 256 120 L 288 0 H 332 V 240 H 288 V 85 L 264 185 H 248 L 224 85 V 240 H 180 Z" />
  </g>
</svg>